# Deploy the restored Node edge to a separate test app. Manual until the
# lazy/parity checks and the production cutover are approved.
name: deploy-edge-node

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DB: ${{ secrets.DATABASE_URL_APP }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flyctl
      - name: create app if missing
        run: flyctl apps create resolvezero-edge-node --org digital-mio || true
      - name: allocate anycast IPs
        run: |
          flyctl ips allocate-v4 -a resolvezero-edge-node -y || true
          flyctl ips allocate-v6 -a resolvezero-edge-node -y || true
      - name: secrets
        run: |
          flyctl secrets set -a resolvezero-edge-node \
            DATABASE_URL="$DB" \
            S3_ENDPOINT="$S3_ENDPOINT" \
            S3_REGION="$S3_REGION" \
            S3_BUCKET="$S3_BUCKET" \
            S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
      - name: deploy
        run: flyctl deploy --config fly.edge-node.toml --remote-only --ha=false
      - name: smoke — lazy readiness
        run: |
          for i in $(seq 1 24); do
            if curl -fsS -m 10 https://resolvezero-edge-node.fly.dev/readyz > /tmp/rz-node-ready.json; then
              cat /tmp/rz-node-ready.json
              grep -q '"lazyLists":true' /tmp/rz-node-ready.json
              grep -q '"ok":true' /tmp/rz-node-ready.json
              exit 0
            fi
            sleep 5
          done
          echo "::error::Node edge failed the readiness smoke"
          exit 1
