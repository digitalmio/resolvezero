# One-shot / re-deploy for the dedicated artifact compiler worker.
# Runtime is the Fly machine; GitHub is only used to build and deploy it.
name: deploy-compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DB: ${{ secrets.DATABASE_URL_APP }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flyctl
      - name: create app if missing
        run: flyctl apps create resolvezero-compiler --org digital-mio || true
      - name: secrets
        run: |
          flyctl secrets set -a resolvezero-compiler \
            DATABASE_URL="$DB" \
            S3_ENDPOINT="$S3_ENDPOINT" \
            S3_REGION="$S3_REGION" \
            S3_BUCKET="$S3_BUCKET" \
            S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
      - name: deploy
        run: flyctl deploy --config fly.compiler.toml --remote-only --ha=false
