# Node edge test app. Runs alongside the Rust production edge and shares the
# production DB for now; do NOT point production DNS at it until parity checks
# and the cutover are complete.
app = "resolvezero-edge-node"
primary_region = "fra"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.edge-node"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[env]
  PORT = "8080"
  LOG_LEVEL = "info"
  ARTIFACT_ONLY_LISTS = "1"
  CONFIG_POLL_MS = "5000"
  DOH_RATE_LIMIT_PER_MIN = "6000"
  UDP_RATE_LIMIT_PER_MIN = "6000"
  TCP_RATE_LIMIT_PER_MIN = "6000"
  # Worst case: 128 active profiles with unique 0.5M-rule lists on 1GB.
  # Shared list URLs are stored once, so typical subscriptions use far less.
  BLOCKLIST_MAX_TOTAL_ENTRIES = "64000000"
  BLOCKLIST_MAX_ENTRIES_PER_PROFILE = "550000"
  # Keep test queries out of the production log prefix.
  S3_LOG_PREFIX = "node-test-logs"
  # Shared DB: never run retention prune from the test app.
  PRUNE_ENABLED = "0"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "GET"
    path = "/readyz"

[metrics]
  port = 9091
  path = "/metrics"
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 53
  [[services.ports]]
    port = 53
    handlers = ["proxy_proto"]
  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"

[[services]]
  protocol = "udp"
  internal_port = 53
  [[services.ports]]
    port = 53

[[services]]
  protocol = "tcp"
  internal_port = 853
  [[services.ports]]
    port = 853
    handlers = ["tls", "proxy_proto"]
    proxy_proto_options = { version = "v2" }
    tls_options = { versions = ["TLSv1.2", "TLSv1.3"] }
