# Rust CI for the remaining Rust service: the per-host DNS-to-DoH agent.
# The edge and artifact compiler are Node; their Rust source is archived in
# the rust-fallback-2026-11-17 tag.
name: agent-rust

on:
  push:
    branches: [main]
    paths:
      - "apps/agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/agent-rust.yml"
  pull_request:
    paths:
      - "apps/agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/agent-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace --locked
