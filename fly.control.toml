# resolvezero control plane (login-first phase)
# Deployed at repo ROOT: FLY_CONFIG=fly.control.toml ./scripts/deploy.sh
# (dockerfile + build-args are resolved relative to the config file's dir,
# and this shares the root Dockerfile with the edge via build-args).
app = "resolvezero-control"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  [build.build_args]
    ENTRY = "apps/control/src/index.ts"

[env]
  PORT = "8080"
  # Secrets (repo/gh + fly secrets, set once):
  #   DATABASE_URL              — app role (same EU PlanetScale)
  #   BETTER_AUTH_SECRET        — session crypto key
  #   GITHUB_CLIENT_ID/SECRET   — OAuth app (callback: /api/auth/callback/github)
  #   TRUSTED_ORIGINS           — comma list (dash/api hosts) once UI lands
  #   BETTER_AUTH_URL           — public base URL (https://api.resolvezero.com)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/healthz"
