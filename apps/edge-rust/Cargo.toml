[package]
name = "resolvezero-edge"
version = "0.1.0"
edition = "2021"
description = "ResolveZero DNS edge — Rust data plane"
license = "MIT"

[dependencies]
axum = "0.8"
base64 = "0.23"
bytes = "1"
flate2 = "1"
futures-util = "0.3"
hickory-proto = "0.26"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
rz-core = { path = "../../crates/rz-core" }
rz-db = { path = "../../crates/rz-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
subtle = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
