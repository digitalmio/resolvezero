# Sentinel — every 10 min: probe the edge; if a Fly-host zombie is detected,
# recreate that region per the runbook (readme §7). Failure notifications are
# GitHub's built-in (email on failed scheduled run) — no custom alerting.
name: sentinel

on:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: probe + self-heal
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          FLYBIN=flyctl
          command -v flyctl >/dev/null 2>&1 || FLYBIN=fly

          healthz=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://resolvezero-edge.fly.dev/healthz || echo 000)
          echo "healthz=$healthz"

          json=$($FLYBIN machines list -a resolvezero-edge --json)
          echo "$json" | jq -r '.[] | [.id, .region, .image_ref.tag, (.checks[0].status // "none"), .host_status] | @tsv'

          bad=$($FLYBIN machines list -a resolvezero-edge --json | jq -r '
            .[]
            | select(
                (.host_status // "ok") != "ok"
                or ((.checks // []) | length == 0)
                or ((.checks // []) | any(.status == "error"))
              )
            | "\(.id)|\(.region)"')
          for row in $bad; do
            id="${row%%|*}"
            region="${row##*|}"
            echo "unhealthy machine: $id ($region) — recreating via scale count"
            $FLYBIN machine destroy "$id" -a resolvezero-edge --force || true
            $FLYBIN scale count 1 --region "$region" -a resolvezero-edge --yes || true
          done

          if [ -n "$bad" ] || [ "$healthz" != "204" ]; then
            sleep 60
            healthz2=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://resolvezero-edge.fly.dev/healthz || echo 000)
            echo "post-op healthz=$healthz2"
            if [ "$healthz2" != "204" ]; then
              echo "::error::edge incident — healthz=$healthz2, unchecked auto-recovery"
              exit 1  # GitHub will notify (email) on workflow failure
            fi
          fi
          echo "all healthy"
