# Break-glass/manual artifact compilation. The primary compiler is the
# dedicated `resolvezero-compiler` Fly worker (apps/compiler/src/main.rs);
# this workflow remains as a fallback if that machine is unavailable.
name: artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: vars.ARTIFACTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build compiler
        run: cargo build --release -p resolvezero-compiler --bin rz-compile
      - name: compile + publish
        env:
          # App role: the compiler only needs DML on rule_artifacts and
          # profile_blocklists (no DDL/admin rights).
          DATABASE_URL: ${{ secrets.DATABASE_URL_APP }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          ARTIFACT_PREFIX: ${{ vars.ARTIFACT_PREFIX || 'artifacts' }}
          RZ_COMPILE: target/release/rz-compile
        run: pnpm exec tsx apps/edge/scripts/artifacts.ts --all
