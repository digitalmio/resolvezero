# One-off decommissioning of the Rust artifact compiler Fly app.
# The Rust edge/compiler source is archived in the `rust-fallback-2026-11-17`
# tag. Run once with destroy=false to inspect machines, then destroy=true.
name: decommission-rust

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy resolvezero-compiler (irreversible)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  decommission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flyctl
      - name: inventory
        run: |
          for app in resolvezero-edge resolvezero-compiler resolvezero-artifacts; do
            echo "== $app"
            flyctl machines list -a "$app" --json 2>/dev/null \
              | jq -r '.[] | [.id, .region, .state, .image_ref.tag, (.checks[0].status // "none"), .host_status] | @tsv' \
              || echo "(no machines / app missing)"
          done
      - name: destroy Rust compiler
        if: ${{ inputs.destroy }}
        run: |
          ids=$(flyctl machines list -a resolvezero-compiler --json 2>/dev/null | jq -r '.[].id')
          for id in $ids; do
            echo "destroying machine $id"
            flyctl machine destroy "$id" -a resolvezero-compiler --force || true
          done
          flyctl apps destroy resolvezero-compiler --yes
          echo "resolvezero-compiler destroyed"
